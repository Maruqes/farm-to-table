# Builds the three app images and pushes them to ghcr.io on every push to main.
# infra/k8s pulls these exact names; the packages must be public (set once in GitHub package settings).
name: images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { app: api, target: prod }
          - { app: web, target: prod }
          - { app: backoffice, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/maruqes/farm-to-table-${{ matrix.app }}:latest
