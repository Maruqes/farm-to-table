<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A4 · Split-flap board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --wall: light-dark(#ecebe6, #0d0d0c);
    --ink: light-dark(#1b1a17, #ece9df);
    --dim: light-dark(#6b675e, #9a958a);
    --flap: light-dark(#1b1a17, #26241f);
    --digit: #ffd166;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--wall); color: var(--ink); font: 15px/1.4 'Azeret Mono', monospace; }
  main { max-width: 56rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  .flaps { display: inline-flex; gap: 2px; }
  .flaps span { position: relative; background: var(--flap); color: var(--digit); padding: .25em .32em; font-weight: 600; min-width: 1.25em; text-align: center; }
  .flaps span::after { content: ''; position: absolute; inset: 50% 0 auto; border-top: 1px solid var(--wall); opacity: .6; }
  .flaps .dot { background: none; color: var(--ink); min-width: 0; padding: .25em 0; }
  .flaps .dot::after { display: none; }
  .flip { animation: flip .35s ease-out; transform-origin: 50% 50%; }
  @keyframes flip { from { transform: rotateX(-90deg); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .flip { animation: none; } }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
  h1 { margin: 0; font-size: clamp(1.4rem, 5vw, 2.4rem); }
  h1 .flaps span { color: var(--paper, #f3f0e6); }
  nav a { color: inherit; margin-left: 1.2rem; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  li { display: grid; grid-template-columns: 3rem 1fr auto; gap: 1rem; align-items: center; padding: .8rem 0; border-bottom: 1px solid var(--dim); }
  li small { color: var(--dim); display: block; }
  .lot { color: var(--dim); }
  .price { font-size: 1.3rem; }
  .live { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; background: var(--flap); color: #ece9df; padding: 1rem; margin-bottom: 1.5rem; text-decoration: none; }
  .live .price { font-size: 2rem; }
</style>
<main>
  <header>
    <h1 aria-label="Farm to table"><span class="flaps" aria-hidden="true"><span>F</span><span>A</span><span>R</span><span>M</span><span class="dot">&nbsp;</span><span>T</span><span>O</span><span class="dot">&nbsp;</span><span>T</span><span>A</span><span>B</span><span>L</span><span>E</span></span></h1>
    <nav><a href="#">Producers</a><a href="#">Auctions</a><a href="#">Cart (2)</a></nav>
  </header>
  <a class="live" href="a3-auction-clock.html"><span>Live · lot 009 · Aged reserve cheese, 3 wheels</span><span class="flaps price" id="live"></span></a>
  <ul id="rows"></ul>
</main>
<script>
const CATS = {
  cheese: '#f2c14e', honey: '#e8962e', bakery: '#d9a066',
  wine: '#a8496c', fruit: '#a8c256', veg: '#5c9e4a',
};
const LOTS = [
  { lot: '014', name: 'Aged reserve cheese', producer: 'Queijaria da Beira', place: 'Seia', unit: 'wheel', price: 16.0, cat: 'cheese' },
  { lot: '015', name: 'Chestnut honey', producer: 'Apiário da Serra', place: 'Manteigas', unit: 'jar', price: 7.8, cat: 'honey' },
  { lot: '016', name: 'Corn bread', producer: 'Pão da Aldeia', place: 'Évora', unit: 'loaf', price: 3.2, cat: 'bakery' },
  { lot: '017', name: 'Douro red 2021', producer: 'Quinta do Vale', place: 'Pinhão', unit: 'bottle', price: 12.5, cat: 'wine' },
  { lot: '018', name: 'Rocha pears', producer: 'Pomar do Oeste', place: 'Bombarral', unit: 'kg', price: 2.1, cat: 'fruit' },
  { lot: '019', name: 'Galega cabbage', producer: 'Horta da Ribeira', place: 'Ponte de Lima', unit: 'bunch', price: 1.4, cat: 'veg' },
  { lot: '020', name: 'Goat cheese, fresh', producer: 'Queijaria da Beira', place: 'Seia', unit: 'piece', price: 4.9, cat: 'cheese' },
  { lot: '021', name: 'Heather honey', producer: 'Apiário da Serra', place: 'Manteigas', unit: 'jar', price: 8.6, cat: 'honey' },
];
const eur = (n) => n.toFixed(2);
  const flaps = (n) => eur(n).padStart(5, '0').split('').map((c) => (c === '.' ? '<span class="dot">.</span>' : `<span>${c}</span>`)).join('');
  // Re-render only the digits that changed, so only those tiles flip.
  function set(el, n) {
    const old = [...el.children].map((s) => s.textContent);
    el.innerHTML = flaps(n);
    [...el.children].forEach((s, i) => { if (old.length && old[i] !== s.textContent) s.classList.add('flip'); });
  }
  rows.innerHTML = LOTS.map((p) => `<li><span class="lot">${p.lot}</span><span>${p.name}<small>${p.producer} · ${p.place} · per ${p.unit}</small></span><span class="flaps price">${flaps(p.price)}</span></li>`).join('');
  let bid = 34;
  set(live, bid);
  setInterval(() => set(live, (bid += 0.5)), 2500);
</script>
</html>
