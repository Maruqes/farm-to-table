# API (Express + Socket.io). Secrets come from the "farm-to-table" Secret:
#   kubectl -n farm-to-table create secret generic farm-to-table --from-env-file=.env
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: farm-to-table
  labels: { app: api }
spec:
  # shortcut: 1 replica, Socket.io rooms and the auction tick live in process memory; add a Redis adapter before scaling.
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/maruqes/farm-to-table-api:latest # pushed by .github/workflows/images.yml
          ports:
            - containerPort: 3000
          env:
            - { name: MONGO_URL, value: mongodb://mongo:27017/farm_to_table }
            # web/nginx is the only proxy in front of the API, so trust exactly one hop.
            - { name: TRUST_PROXY, value: "1" }
            - { name: S3_ENDPOINT, value: http://silo:9000 }
            - { name: S3_BUCKET, value: farm-to-table }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: farm-to-table, key: JWT_SECRET } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: farm-to-table, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: farm-to-table, key: S3_SECRET_KEY } }
          readinessProbe:
            tcpSocket: { port: 3000 }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: farm-to-table
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
