# Backoffice (Laravel admin). Secrets come from the "farm-to-table" Secret (see api.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice
  labels: { app: backoffice }
spec:
  # shortcut: 1 replica, sessions and cache are files inside the pod; move them to a shared store before scaling.
  replicas: 1
  selector:
    matchLabels: { app: backoffice }
  template:
    metadata:
      labels: { app: backoffice }
    spec:
      containers:
        - name: backoffice
          image: farm-to-table/backoffice:latest
          imagePullPolicy: IfNotPresent # built on the node by infra/jenkins/Jenkinsfile, never pulled
          ports:
            - containerPort: 8000
          env:
            - name: APP_KEY
              valueFrom: { secretKeyRef: { name: farm-to-table, key: BACKOFFICE_APP_KEY } }
            - { name: DB_CONNECTION, value: mongodb }
            - { name: MONGODB_URI, value: mongodb://mongo:27017 }
            - { name: MONGODB_DATABASE, value: farm_to_table }
            - { name: SESSION_DRIVER, value: file }
            - { name: CACHE_STORE, value: file }
            - { name: QUEUE_CONNECTION, value: sync }
          readinessProbe:
            tcpSocket: { port: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: backoffice
spec:
  selector: { app: backoffice }
  ports:
    - port: 8000
      targetPort: 8000
