# MongoDB, shared by the API and the backoffice. Cluster-internal only, no auth (same as compose).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: farm-to-table
  labels: { app: mongo }
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:8
          ports:
            - containerPort: 27017
          volumeMounts:
            - { name: data, mountPath: /data/db }
          readinessProbe:
            tcpSocket: { port: 27017 }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: farm-to-table
spec:
  selector: { app: mongo }
  ports:
    - port: 27017
      targetPort: 27017
