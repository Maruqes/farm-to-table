# Web (nginx serving the SPA; also proxies /api, /api-docs, /socket.io to the "api" Service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: farm-to-table
  labels: { app: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/maruqes/farm-to-table-web:latest # pushed by .github/workflows/images.yml
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket: { port: 80 }
---
# The public entry point.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: farm-to-table
spec:
  type: NodePort
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 # reachable on every node; overridden by K8S_WEB_PORT in .env at deploy
